<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("l3DcTheme_v1") === "light" ? "light" : "dark";
          document.documentElement.dataset.appTheme = theme;
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.appTheme = "dark";
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="application-name" content="L3 Depot Controller Template" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="L3 Depot Controller Template" />
    <title>L3 Depot Controller Template</title>
    <link rel="stylesheet" href="/auth/session-loading.css" />
  </head>
  <body>
    <div id="root">
      <main class="session-loading-screen">
        <header class="brand-lockup">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><rect x="7" y="4" width="18" height="21" rx="6" stroke="currentColor" stroke-width="1.8" /><path d="M11 10h10M11 15h10M12 21l-3 6m11-6 3 6M11 27h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" /><circle cx="12" cy="19" r="1.2" fill="currentColor" /><circle cx="20" cy="19" r="1.2" fill="currentColor" /></svg></span>
          <div><h1>L3 DC TEMPLATE</h1><p>DEPOT CONTROL</p></div>
        </header>
        <section class="session-check-panel" role="status" aria-live="polite" aria-busy="true">
          <span class="session-check-spinner" aria-hidden="true"></span>
          <h2>Checking your session…</h2>
          <p>Opening your workspace securely.</p>
        </section>
        <p class="shell-footer">LINE 3 <span>•</span> WEST DEPOT <span>•</span> SECURE ACCESS</p>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
