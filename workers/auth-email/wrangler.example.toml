name = "l3-dc-auth-email"
main = "src/index.js"
compatibility_date = "2026-05-26"

# This Worker is callable only through a Service Binding from the Pages app.
# Keep both public workers.dev access and preview URLs disabled.
workers_dev = false
preview_urls = false

# Configure these as encrypted Worker secrets in the Cloudflare dashboard:
# - AUTH_EMAIL_SERVICE_TOKEN (the same strong secret used by the Pages binding)
# - AUTH_GMAIL_CLIENT_ID (the dedicated Gmail OAuth client ID)
# - AUTH_GMAIL_CLIENT_SECRET (the dedicated Gmail OAuth client secret)
# - AUTH_GMAIL_REFRESH_TOKEN (an offline Gmail OAuth refresh token)
# - AUTH_EMAIL_FROM (the dedicated Gmail sender address)
# - AUTH_ALLOWED_EMAILS (the private staff allowlist; comma/newline separated)
# Do not add their real values to this file or to Git.

# Do not add routes or custom domains to this Worker. Bind it to the Pages
# project as a Service Binding named AUTH_EMAIL_SERVICE.
