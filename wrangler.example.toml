name = "raillog"
compatibility_date = "2026-05-26"
pages_build_output_dir = "dist"

[vars]
AUTH_MODE = "cloudflare_access"
CF_ACCESS_TEAM_DOMAIN = "your-team.cloudflareaccess.com"
CF_ACCESS_AUD = "PUT_ACCESS_APPLICATION_AUD_TAGS_HERE_COMMA_SEPARATED"
TURNSTILE_SITE_KEY = "PUT_ENVIRONMENT_TURNSTILE_SITE_KEY_HERE"

# Store OCC_ALLOWED_EMAILS as an encrypted Pages secret for both Production
# and Preview. Never place the private L3 DC address in this file or in Git.

# Custom PIN mode also requires encrypted AUTH_LOGIN_EMAIL,
# AUTH_HMAC_SECRET, AUTH_EMAIL_SERVICE_TOKEN, and TURNSTILE_SECRET_KEY secrets.
# Gmail OAuth credentials belong only on the private AUTH_EMAIL_SERVICE Worker,
# never on the Pages project or in this file.
# Keep AUTH_MODE=cloudflare_access until docs/custom-pin-auth.md is complete.

# For Cloudflare Pages, create a D1 database first, then bind it as DB.
# Replace database_id with your own D1 Database ID before renaming this file to wrangler.toml.
[[d1_databases]]
binding = "DB"
database_name = "raillog-db"
database_id = "PUT_YOUR_D1_DATABASE_ID_HERE"

# The private mailer has no public route; Pages calls it through this binding.
[[services]]
binding = "AUTH_EMAIL_SERVICE"
service = "l3-dc-auth-email"

# See docs/custom-pin-auth.md and workers/auth-email/README.md.
