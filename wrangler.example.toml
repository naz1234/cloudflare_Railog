name = "raillog"
compatibility_date = "2026-05-26"
pages_build_output_dir = "dist"

# For Cloudflare Pages, create a D1 database first, then bind it as DB.
# Replace database_id with your own D1 Database ID before renaming this file to wrangler.toml.
[[d1_databases]]
binding = "DB"
database_name = "raillog-db"
database_id = "PUT_YOUR_D1_DATABASE_ID_HERE"

# Optional: token required by /api/email-request when configured in Cloudflare Pages.
# In Pages dashboard, add this as an Environment Variable instead of committing a real token.
# EMAIL_IMPORT_TOKEN = "choose-your-own-long-secret-token"
